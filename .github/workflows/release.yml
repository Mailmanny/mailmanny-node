# Publishes `mailmanny` to npm when package.json carries a version that isn't on npm yet, then tags it and opens a
# GitHub release. Uses npm trusted publishing (OIDC): no npm token is stored anywhere, and npm attaches a provenance
# attestation linking the package to this workflow run. Configure it once on npmjs.com → mailmanny → Settings →
# Trusted publishing: GitHub Actions, organization "Mailmanny", repository "mailmanny-node", workflow "release.yml".
# Written in the private app repo at packages/mailmanny/.github/ and mirrored here; it never runs in the private repo.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the version tag + GitHub release
  id-token: write # npm trusted publishing (and provenance)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - name: Is this version already on npm?
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! npm view mailmanny name >/dev/null 2>&1; then
            # npm can only trust this workflow for a package that exists: the very first version is published by hand
            # (docs/SDK-RELEASE.md in the private repo). Until then, skip instead of failing.
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mailmanny isn't on npm yet. Publish the first version by hand, then set up trusted publishing."
          elif npm view "mailmanny@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "mailmanny@$VERSION is already on npm; nothing to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Releasing mailmanny@$VERSION."
          fi

      - if: steps.version.outputs.publish == 'true'
        run: npm install --no-audit --no-fund

      - if: steps.version.outputs.publish == 'true'
        name: Typecheck, build and smoke test
        run: |
          npm run typecheck
          npm run build
          npm run smoke

      - if: steps.version.outputs.publish == 'true'
        name: Publish to npm
        run: npm publish --access public

      - if: steps.version.outputs.publish == 'true'
        name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes "Published to npm: https://www.npmjs.com/package/mailmanny/v/$VERSION"
